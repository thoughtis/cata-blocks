name: Image lightbox regression

on:
  pull_request:
    paths:
      - 'blocks/image-lightbox/**'
      - '.github/workflows/image-lightbox-regression.yml'
  push:
    branches: [main]
    paths:
      - 'blocks/image-lightbox/**'
      - '.github/workflows/image-lightbox-regression.yml'

permissions:
  contents: read

jobs:
  meta-only-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP and generated renderer
        run: |
          php -l blocks/image-lightbox/image-lightbox.php
          php -l blocks/image-lightbox/src/render.php
          cmp blocks/image-lightbox/src/render.php blocks/image-lightbox/build/render.php
      - name: Exercise collection and server rendering
        run: |
          CATA_LIGHTBOX_VIDEO_FIXTURE="$RUNNER_TEMP/lightbox-video.html" \
          CATA_LIGHTBOX_END_FIXTURE="$RUNNER_TEMP/lightbox-end.html" \
          php blocks/image-lightbox/tests/meta-only.php
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exercise video and end-card navigation
        run: |
          node blocks/image-lightbox/tests/video-playback.mjs "$RUNNER_TEMP/lightbox-video.html"
          node blocks/image-lightbox/tests/end-card.mjs "$RUNNER_TEMP/lightbox-end.html"
